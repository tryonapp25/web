<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pizza Menu Template</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #121212;
      --orange: #d67a2c;
      --panel: #1b1b1b;
      --text: #f2f2f2;
      --muted: #cfcfcf;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .stage {
      width: 100%;
      height: 100vh;
      position: relative;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 30% 10%, #1f1f1f, #101010 55%, #0b0b0b),
        linear-gradient(180deg, #141414, #0b0b0b);
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("/assets/bg.png") center / cover no-repeat;
      opacity: 0.35;
    }

    /* Top bar */
    .topbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 18px;
      display: flex;
      justify-content: center;
      z-index: 3;
    }

    .brand {
      background: #b45a1f;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
    }

    .title {
      position: absolute;
      top: 80px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: clamp(42px, 7vw, 72px);
      font-weight: 800;
      color: #e09a25;
      transform: skewX(-8deg);
      font-family: ui-serif, Georgia, serif;
      z-index: 3;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    /* Sections */
    .section {
      position: absolute;
      width: 44%;
      z-index: 3;
    }

    .section h3 {
      margin-bottom: 10px;
      color: var(--orange);
      letter-spacing: 0.6px;
    }

    .lines {
      display: grid;
      gap: 12px;
      font-size: 14px;
      color: var(--muted);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
    }

    .dots {
      position: relative;
    }

    .dots::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 2px;
      border-bottom: 1px dotted rgba(255, 255, 255, 0.35);
      z-index: -1;
    }

    .name {
      padding-right: 10px;
    }

    .price {
      color: #e09a25;
      font-weight: 700;
    }

    /* Positions */
    .regular {
      right: 40px;
      top: 255px;
    }

    .medium {
      left: 40px;
      top: 560px;
      width: 42%;
    }

    .premium {
      right: 40px;
      bottom: 160px;
    }

    /* Pizza slots */
    .pizzaSlot {
      position: absolute;
      z-index: 4;
      border-radius: 999px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      outline: 2px solid rgba(255, 255, 255, 0.06);
    }

    .pizzaSlot iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .slot1 {
      left: 55px;
      top: 185px;
      width: 320px;
      height: 320px;
    }

    .slot2 {
      right: 45px;
      top: 470px;
      width: 360px;
      height: 360px;
    }

    .slot3 {
      left: 55px;
      bottom: 70px;
      width: 340px;
      height: 340px;
    }

    .hint {
      position: absolute;
      left: 18px;
      bottom: 18px;
      font-size: 12px;
      opacity: 0.75;
      background: rgba(0, 0, 0, 0.45);
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 6;
    }

    /* Mobile */
    @media (max-width: 760px) {
      .slot1 {
        width: 220px;
        height: 220px;
        left: 20px;
      }

      .slot2 {
        width: 240px;
        height: 240px;
        right: 20px;
      }

      .slot3 {
        width: 240px;
        height: 240px;
        left: 20px;
      }

      .regular,
      .medium,
      .premium {
        width: 45%;
      }
    }
  </style>
</head>

<body>
  <div class="stage">
    <div class="topbar">
      <div class="brand">Borcelle Restaurant</div>
    </div>

    <div class="title">Pizza Menu</div>

    <!-- REGULAR -->
    <div class="section regular">
      <h3>REGULAR PIZZA</h3>
      <div class="lines">
        <div class="row">
          <div class="dots"><span class="name">Veg Pizza 01</span></div>
          <div class="price">$20</div>
        </div>
        <div class="row">
          <div class="dots"><span class="name">Mushroom Pizza 02</span></div>
          <div class="price">$22</div>
        </div>
        <div class="row">
          <div class="dots"><span class="name">Chicken Pizza 03</span></div>
          <div class="price">$24</div>
        </div>
      </div>
    </div>

    <!-- MEDIUM -->
    <div class="section medium">
      <h3>MEDIUM PIZZA</h3>
      <div class="lines">
        <div class="row">
          <div class="dots"><span class="name">Cheese Pizza 01</span></div>
          <div class="price">$30</div>
        </div>
        <div class="row">
          <div class="dots"><span class="name">Chicken Salami 02</span></div>
          <div class="price">$32</div>
        </div>
        <div class="row">
          <div class="dots"><span class="name">Veg Mushroom 03</span></div>
          <div class="price">$34</div>
        </div>
      </div>
    </div>

    <!-- PREMIUM -->
    <div class="section premium">
      <h3>PREMIUM PIZZA</h3>
      <div class="lines">
        <div class="row">
          <div class="dots"><span class="name">Supreme Pizza 01</span></div>
          <div class="price">$40</div>
        </div>
        <div class="row">
          <div class="dots"><span class="name">Margherita 02</span></div>
          <div class="price">$42</div>
        </div>
        <div class="row">
          <div class="dots"><span class="name">Double Cheese 03</span></div>
          <div class="price">$44</div>
        </div>
      </div>
    </div>

    <!-- 3D Model Slots -->
    <div class="pizzaSlot slot1">
      <iframe src="http://127.0.0.1:1267/model/name/pizza3"></iframe>
    </div>

    <div class="pizzaSlot slot2">
      <iframe src="http://127.0.0.1:1267/model/name/pizza2"></iframe>
    </div>

    <div class="pizzaSlot slot3">
      <iframe src="http://127.0.0.1:1267/model/name/pizza2"></iframe>
    </div>

    <div class="hint">Click a pizza image</div>
  </div>
</body>
</html>
